services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: localai
      POSTGRES_USER: localai
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [appnet]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U localai -d localai"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: ./backend
    ports: ["127.0.0.1:8000:8000"]
    environment:
      DATABASE_URL: postgresql://localai:${DB_PASSWORD}@db:5432/localai
      SECRET_KEY: ${SECRET_KEY}
      DATA_DIR: /data
    volumes:
      - ./data:/data
    extra_hosts: ["host.docker.internal:host-gateway"]
    depends_on:
      db:
        condition: service_healthy
    networks: [appnet]

  frontend:
    build: ./frontend
    ports: ["127.0.0.1:3000:3000"]
    depends_on: [api]
    networks: [appnet]

volumes:
  pgdata:
networks:
  appnet:

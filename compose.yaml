services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: localai
      POSTGRES_USER: localai
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [appnet]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U localai -d localai"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: ./backend
    ports: ["127.0.0.1:8000:8000"]
    environment:
      DATABASE_URL: postgresql://localai:${DB_PASSWORD}@db:5432/localai
      SECRET_KEY: ${SECRET_KEY}
      DATA_DIR: /data
      MCP_TOOLBOX_URL: http://toolbox:9000/mcp
    volumes:
      - ./data:/data
    extra_hosts: ["host.docker.internal:host-gateway"]
    depends_on:
      db:
        condition: service_healthy
      toolbox:
        condition: service_healthy
    networks: [appnet]

  toolbox:
    build: ./mcp_servers/toolbox
    environment:
      SEARXNG_URL: http://searxng:8080
    networks: [appnet]
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:9000/health', timeout=3)\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  searxng:
    image: searxng/searxng:latest
    volumes:
      - ./searxng:/etc/searxng
    environment:
      SEARXNG_BASE_URL: http://searxng:8080/
      SEARXNG_SECRET: ${SEARXNG_SECRET}
    networks: [appnet]

  frontend:
    build: ./frontend
    ports: ["127.0.0.1:3000:3000"]
    depends_on: [api]
    networks: [appnet]

volumes:
  pgdata:
networks:
  appnet:
